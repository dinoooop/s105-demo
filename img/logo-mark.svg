<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DEMO Hardware logo mark">
  <title>DEMO Hardware</title>
  <!-- Four arms radiating from a central knuckle, each clamping a glass-panel
       corner — an abstraction of the spider-fitting / point-glazing hardware
       DEMO Hardware supplies. -->
  <g stroke="#12304A" stroke-width="9" stroke-linecap="round">
    <line x1="32" y1="32" x2="50" y2="14" />
    <line x1="32" y1="32" x2="14" y2="14" />
    <line x1="32" y1="32" x2="50" y2="50" />
    <line x1="32" y1="32" x2="14" y2="50" />
  </g>
  <circle cx="50" cy="14" r="5.2" fill="#F0A93E" />
  <circle cx="14" cy="14" r="5.2" fill="#F0A93E" />
  <circle cx="50" cy="50" r="5.2" fill="#F0A93E" />
  <circle cx="14" cy="50" r="5.2" fill="#F0A93E" />
  <circle cx="32" cy="32" r="9.4" fill="#12304A" />
  <circle cx="32" cy="32" r="3.4" fill="#F0A93E" />
</svg>
